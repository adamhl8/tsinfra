[test]
pathIgnorePatterns = ["**/fixtures/**", "**/fixture/**"]
coverage = true
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["**/__tests__/**", "src/cli/**"]
concurrentTestGlob = "**/*.test.ts"
onlyFailures = true
preload = ["./src/__tests__/test-setup.ts"]

[install]
linker = "isolated"

[run]
bun = true
